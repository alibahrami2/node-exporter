---
node_exporter_version: "1.8.2"
node_exporter_user: "node_exporter"
node_exporter_group: "node_exporter"
node_exporter_listen_address: "0.0.0.0:9100"

# Mapping architecture
node_exporter_arch_map:
  x86_64: "amd64"
  aarch64: "arm64"
node_exporter_arch: "{{ node_exporter_arch_map[ansible_architecture] | default('amd64') }}"

# Download URL (Overridable for internal Nexus/Mirror)
node_exporter_base_url: "https://github.com/prometheus/node_exporter/releases/download"
node_exporter_download_url: "{{ node_exporter_base_url }}/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"

# Optional local tarball path (if set, skips internet download)
node_exporter_local_archive: ""

# Custom collectors & directories
node_exporter_textfile_dir: "/var/lib/node_exporter/textfile_collector"
node_exporter_extra_args:
  - "--collector.systemd"
  - "--collector.textfile.directory={{ node_exporter_textfile_dir }}"

# Security / Firewall (Optional: restrict scrape to Prometheus IP)
node_exporter_manage_firewall: false
prometheus_server_ip: ""
